<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Alerts | LogSentinel AI</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="../assets/css/style.css">

</head>

<body>

    <!-- ========================= -->
    <!-- SIDEBAR -->
    <!-- ========================= -->

    <div class="sidebar">

        <div class="logo">

            LogSentinel AI

        </div>

        <a href="dashboard.html">

            Dashboard

        </a>

        <a href="alerts.html">

            Alerts

        </a>

        <a href="log-analytics.html">

            Log Analysis

        </a>

        <a href="incidents.html">

            Incidents

        </a>

        <a href="investigation.html">

            Investigation

        </a>



    </div>


    <!-- ========================= -->
    <!-- MAIN CONTENT -->
    <!-- ========================= -->

    <div class="main-content">

        <!-- ========================= -->
        <!-- PAGE HEADER -->
        <!-- ========================= -->

        <div class="d-flex
                    justify-content-between
                    align-items-center
                    mb-4">

            <div>

                <h1>

                    Threat Alerts

                </h1>

                <p class="text-secondary">

                    Monitor and investigate
                    security detections

                </p>

            </div>

            <button class="btn btn-soc" id="export-alerts-btn">

                Export Alerts

            </button>

        </div>


        <!-- ========================= -->
        <!-- FILTERS -->
        <!-- ========================= -->

        <div class="soc-card mb-4">

            <div class="row g-3">


                <!-- SEARCH -->

                <div class="col-md-3">

                    <input
                        type="text"
                        class="form-control
                               bg-dark
                               text-light
                               border-secondary"
                        id="search-filter"
                        placeholder="Search alerts...">

                </div>


                <!-- SEVERITY -->

                <div class="col-md-3">

                    <select
                        class="form-select
                               bg-dark
                               text-light
                               border-secondary"
                        id="severity-filter">

                        <option value="">

                            All Severities

                        </option>

                        <option value="critical">

                            Critical

                        </option>

                        <option value="high">

                            High

                        </option>

                        <option value="medium">

                            Medium

                        </option>

                        <option value="low">

                            Low

                        </option>

                    </select>

                </div>


                <!-- SOURCE -->

                <div class="col-md-3">

                    <select
                        class="form-select
                               bg-dark
                               text-light
                               border-secondary"
                        id="source-filter">

                        <option value="">

                            All Sources

                        </option>

                    </select>

                </div>


                <!-- STATUS -->

                <div class="col-md-3">

                    <select
                        class="form-select
                               bg-dark
                               text-light
                               border-secondary"
                        id="status-filter">

                        <option value="">

                            All Status

                        </option>

                        <option value="open">

                            Open

                        </option>

                        <option value="investigating">

                            Investigating

                        </option>

                        <option value="resolved">

                            Resolved

                        </option>

                    </select>

                </div>

            </div>

        </div>


        <!-- ========================= -->
        <!-- ALERTS TABLE -->
        <!-- ========================= -->

        <div class="soc-card">

            <div class="table-responsive">

                <table class="table
                              table-dark
                              table-hover
                              align-middle">

                    <thead>

                        <tr>

                            <th>

                                Timestamp

                            </th>

                            <th>

                                Source

                            </th>

                            <th>

                                Threat

                            </th>

                            <th>

                                Severity

                            </th>

                            <th>

                                MITRE

                            </th>

                            <th>

                                Status

                            </th>

                            <th>

                                Confidence

                            </th>

                            <th>

                                Actions

                            </th>

                        </tr>

                    </thead>


                    <!-- DYNAMIC ALERTS -->

                    <tbody id="alerts-table-body">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- ALERTS JS -->
    <!-- ========================= -->

    <script src="../assets/js/alerts.js"></script>

</body>

</html>
