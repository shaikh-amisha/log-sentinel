<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Incidents | LogSentinel AI
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="../assets/css/style.css">

</head>

<body>

    <!-- ========================= -->
    <!-- SIDEBAR -->
    <!-- ========================= -->

    <div class="sidebar">

        <div class="logo">

            LogSentinel AI

        </div>

        <a href="dashboard.html">

            Dashboard

        </a>

        <a href="alerts.html">

            Alerts

        </a>

        <a href="log-analytics.html">

            Log Analysis

        </a>

        <a href="incidents.html">

            Incidents

        </a>

        <a href="investigation.html">

            Investigation

        </a>


    </div>


    <!-- ========================= -->
    <!-- MAIN CONTENT -->
    <!-- ========================= -->

    <div class="main-content">

        <!-- ========================= -->
        <!-- PAGE HEADER -->
        <!-- ========================= -->

        <div class="d-flex
                    justify-content-between
                    align-items-center
                    mb-4">

            <div>

                <h1>

                    Incident Reports

                </h1>

                <p class="text-secondary">

                    Track investigations,
                    remediation,
                    and response workflows

                </p>

            </div>

            <button class="btn btn-soc">

                Create Incident

            </button>

        </div>


        <!-- ========================= -->
        <!-- INCIDENTS TABLE -->
        <!-- ========================= -->

        <div class="soc-card">

            <div class="table-responsive">

                <table class="table
                              table-dark
                              table-hover
                              align-middle">

                    <thead>

                        <tr>

                            <th>
                                Incident ID
                            </th>

                            <th>
                                Threat
                            </th>

                            <th>
                                Severity
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                MITRE
                            </th>

                            <th>
                                Timestamp
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>

                    <!-- DYNAMIC INCIDENTS -->

                    <tbody id="incidents-table-body">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- VIEW INCIDENT MODAL -->
    <!-- ========================= -->

    <div class="modal fade"
         id="incidentModal"
         tabindex="-1">

        <div class="modal-dialog modal-xl">

            <div class="modal-content
                        bg-dark
                        text-light">

                <!-- HEADER -->

                <div class="modal-header border-secondary">

                    <h5 class="modal-title">

                        AI Incident Report

                    </h5>

                    <button type="button"
                            class="btn-close btn-close-white"
                            data-bs-dismiss="modal">

                    </button>

                </div>


                <!-- BODY -->

                <div class="modal-body">

                    <div id="incident-report-content">

                        Loading report...

                    </div>

                </div>


                <!-- FOOTER -->

                <div class="modal-footer border-secondary">

                    <button
                        class="btn btn-outline-light"
                        data-bs-dismiss="modal">

                        Close

                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- BOOTSTRAP -->
    <!-- ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- ========================= -->
    <!-- INCIDENTS JS -->
    <!-- ========================= -->

    <script src="../assets/js/incidents.js"></script>

</body>

</html>
